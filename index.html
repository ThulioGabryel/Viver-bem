<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>ViverBem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar + topbar SaaS shell; onboarding split; public booking page is a phone-first column. */
:root{
  --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#EFF4F1; --surface-3:#E6EEE9;
  --ink:#13201A; --ink-2:#34463D; --muted:#64756C; --line:#E0E8E3; --line-2:#CFDBD4;
  --brand:#1C7A56; --brand-ink:#FFFFFF; --brand-soft:#E2F1E9; --brand-strong:#125C40;
  --accent:#1C7A56; --accent-soft:#E2F1E9; --accent-ink:#FFFFFF;
  --ok:#1D8549; --ok-soft:#E1F3E8; --warn:#A86A12; --warn-soft:#FBF0DA; --bad:#BE3D36; --bad-soft:#FBE6E4; --info:#2B67A6; --info-soft:#E4EDF8; --violet:#6B4FA6; --violet-soft:#EEE8F8;
  --side-bg:#FFFFFF; --side-ink:#34463D; --side-muted:#7A8A82; --side-active:#E2F1E9; --side-active-ink:#125C40; --side-line:#E0E8E3;
  --scrim:rgba(14,24,19,.42);
  --shadow:0 1px 2px rgba(19,32,26,.05),0 10px 30px -14px rgba(19,32,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(19,32,26,.35);
  --r-sm:6px; --r:9px; --r-lg:13px;
  --f-display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
  --ink:#E4EEE8; --ink-2:#BFCEC6; --muted:#8C9C94; --line:#24312B; --line-2:#31413A;
  --brand:#3DAE7F; --brand-ink:#04140C; --brand-soft:#16332A; --brand-strong:#77D3AA;
  --accent:#3DAE7F; --accent-soft:#16332A; --accent-ink:#04140C;
  --ok:#52C487; --ok-soft:#163323; --warn:#E0A645; --warn-soft:#352914; --bad:#EE7C74; --bad-soft:#3A1C1A; --info:#78AEE6; --info-soft:#18283C; --violet:#B39BE6; --violet-soft:#2A2340;
  --side-bg:#121A16; --side-ink:#BFCEC6; --side-muted:#7E8E86; --side-active:#16332A; --side-active-ink:#86DDB6; --side-line:#24312B;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
  --ink:#E4EEE8; --ink-2:#BFCEC6; --muted:#8C9C94; --line:#24312B; --line-2:#31413A;
  --brand:#3DAE7F; --brand-ink:#04140C; --brand-soft:#16332A; --brand-strong:#77D3AA;
  --accent:#3DAE7F; --accent-soft:#16332A; --accent-ink:#04140C;
  --ok:#52C487; --ok-soft:#163323; --warn:#E0A645; --warn-soft:#352914; --bad:#EE7C74; --bad-soft:#3A1C1A; --info:#78AEE6; --info-soft:#18283C; --violet:#B39BE6; --violet-soft:#2A2340;
  --side-bg:#121A16; --side-ink:#BFCEC6; --side-muted:#7E8E86; --side-active:#16332A; --side-active-ink:#86DDB6; --side-line:#24312B;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark }
/* Personal trainer: its own energy — dark rail, ember accent */
.app[data-prof="per"]{ --accent:#D9581F; --accent-soft:#FCE9DE; --accent-ink:#FFFFFF;
  --side-bg:#14201A; --side-ink:#C9D6CF; --side-muted:#7F9088; --side-active:#22352C; --side-active-ink:#FFB38A; --side-line:#22312A }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .app[data-prof="per"]{ --accent:#F07A43; --accent-soft:#3A2116; --accent-ink:#1A0A03; --side-bg:#0B110E } }
:root[data-theme="dark"] .app[data-prof="per"]{ --accent:#F07A43; --accent-soft:#3A2116; --accent-ink:#1A0A03; --side-bg:#0B110E }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:26px;line-height:1.15} h2{font-size:19px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.nw{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.hide-m{}
@media (max-width:720px){.hide-m{display:none!important}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
:root[data-theme="dark"] .btn.pri:hover{color:var(--brand-ink)}
.app[data-prof="per"] .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.app[data-prof="per"] .btn.pri:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:5px}
.btn.icon{width:36px;padding:0}
.btn.icon.sm{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea.input{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.sm{height:32px;font-size:13px}
.input-ic{position:relative} .input-ic .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)} .input-ic .input{padding-left:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}
.err{color:var(--bad);font-size:12.5px}
.prefix{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.prefix span{padding:0 10px;display:flex;align-items:center;background:var(--surface-2);color:var(--muted);font-size:12.5px;white-space:nowrap;border-right:1px solid var(--line)}
.prefix .input{border:0;border-radius:0}
.toggle{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line-2);border:0;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)} .toggle.on::after{transform:translateX(16px)}

/* ---------- Chips, pills ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .cnt{font-size:11px;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.vio{background:var(--violet-soft);color:var(--violet)} .pill.brand{background:var(--brand-soft);color:var(--brand-strong)}
.pill.plain::before{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}

/* ---------- Avatar ---------- */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:var(--brand-soft);color:var(--brand-strong);overflow:hidden;letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:56px;height:56px;font-size:18px} .av.xl{width:84px;height:84px;font-size:26px} .av.sm{width:28px;height:28px;font-size:11px}
.av.t1{background:#E4EEF8;color:#2B5F96}.av.t2{background:#F6EADB;color:#8A5517}.av.t3{background:#EEE8F8;color:#5E4596}.av.t4{background:#F9E4E2;color:#A3392F}.av.t5{background:#E2F1E9;color:#125C40}
:root[data-theme="dark"] .av.t1{background:#1B2B3E;color:#9CC4EE}:root[data-theme="dark"] .av.t2{background:#33281A;color:#E8B97C}:root[data-theme="dark"] .av.t3{background:#2A2340;color:#C2AEEC}:root[data-theme="dark"] .av.t4{background:#3A1F1D;color:#F0A39D}:root[data-theme="dark"] .av.t5{background:#16332A;color:#86DDB6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av.t1{background:#1B2B3E;color:#9CC4EE}:root:not([data-theme="light"]) .av.t2{background:#33281A;color:#E8B97C}:root:not([data-theme="light"]) .av.t3{background:#2A2340;color:#C2AEEC}:root:not([data-theme="light"]) .av.t4{background:#3A1F1D;color:#F0A39D}:root:not([data-theme="light"]) .av.t5{background:#16332A;color:#86DDB6}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--side-bg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px));color:var(--side-ink)}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--side-ink)}
.app[data-prof] .logo b{color:var(--side-ink)}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff}
.prof-badge{margin:0 4px 14px;padding:10px;border-radius:var(--r);border:1px solid var(--side-line);display:flex;gap:10px;align-items:center;background:transparent;width:calc(100% - 8px);text-align:left;color:var(--side-ink)}
.prof-badge:hover{background:var(--side-active)}
.prof-badge .pi{width:32px;height:32px;border-radius:8px;background:var(--side-active);color:var(--side-active-ink);display:grid;place-items:center;flex:none}
.prof-badge b{display:block;font-size:13px;font-weight:600}
.prof-badge small{display:block;font-size:11.5px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--side-ink);font-weight:500;font-size:13.5px;text-align:left;width:100%}
.nav button:hover{background:var(--side-active)}
.nav button.on{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
.nav button .ic{opacity:.85}
.side-foot{margin-top:auto;padding-top:14px}
.site-card{border-radius:var(--r);padding:12px;background:var(--side-active);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.site-card code{font-family:var(--f-body);font-size:11.5px;color:var(--side-active-ink);word-break:break-all}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:62px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.top .gsearch{flex:1;max-width:420px;position:relative}
.top .burger{display:none}
.content{padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(0px,1.6vw,18px)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;z-index:70;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow-lg);padding-top:max(18px,env(safe-area-inset-top,0px))}
  .app.menu .side{transform:none}
  .top .burger{display:inline-flex}
}

/* demo switch */
.demo-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 8px;border-radius:var(--r);border:1px dashed var(--line-2);background:transparent;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.demo-btn:hover{background:var(--surface-2)}
.demo-btn .dot{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* ---------- Page head ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph .sub{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input-ic{width:280px;max-width:100%}
@media (max-width:640px){.toolbar .input-ic{width:100%}}

/* ---------- Cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px}
.panel-b{padding:16px}
.panel-b.tight{padding:6px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.layout.wide-r{grid-template-columns:minmax(0,1fr) 420px}
.layout.l-side{grid-template-columns:300px minmax(0,1fr)}
@media (max-width:1180px){.layout,.layout.wide-r{grid-template-columns:1fr}}
@media (max-width:900px){.layout.l-side{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* KPI strip: a single bordered band, divided cells (not floating tiles) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px}
.kpi{padding:15px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-l{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:500}
.kpi .k-l .ic{color:var(--accent)}
.kpi .k-v{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v.sm{font-size:17px}
.kpi .k-s{font-size:11.5px;color:var(--muted)}
.kpi .k-s .up{color:var(--ok);font-weight:600} .kpi .k-s .dn{color:var(--bad);font-weight:600}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .who{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .who b{font-weight:600;display:block;white-space:nowrap}
.tbl .who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .r{text-align:right}
@media (max-width:720px){
  table.tbl.cards thead{display:none}
  table.tbl.cards,table.tbl.cards tbody,table.tbl.cards tr,table.tbl.cards td{display:block;width:100%}
  table.tbl.cards tr{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  table.tbl.cards td{padding:0;border:0}
  table.tbl.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  table.tbl.cards td.full{grid-column:1/-1}
  table.tbl.cards td.act{grid-column:1/-1;text-align:left}
  .tbl .r{text-align:left}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* list rows */
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface-2)}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;width:46px;flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.app[data-prof="per"] .bar>i{background:var(--accent)}

/* empty / skeleton */
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty .ei{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:4px}
.empty b{color:var(--ink);font-weight:600}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.1s infinite linear;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* tabs / segmented */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:38px;padding:0 12px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{height:28px;padding:0 11px;border-radius:6px;border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- Overlays ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:var(--scrim);animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.lg{max-width:820px} .modal.sm{max-width:420px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal-h p{color:var(--muted);font-size:13px;margin-top:3px}
.modal-b{padding:6px 20px 18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer-wrap{position:fixed;inset:0;z-index:75;background:var(--scrim);animation:fade .15s}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-b{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}} @keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.modal,.drawer,.modal-wrap,.drawer-wrap{animation:none}}
.dd{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;animation:pop .12s}
.dd button.it{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13.5px}
.dd button.it:hover{background:var(--surface-2)}
.dd button.it.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.dd-h{padding:8px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rel{position:relative}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:pop .2s;max-width:380px}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none}
.toast.err .ti{background:var(--bad)}
.toast.info .ti{background:var(--info)}
.loader{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;place-items:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Onboarding ---------- */
.ob{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);min-height:100vh}
.ob-l{background:#123D2D;color:#DCEDE3;padding:40px 36px 32px max(36px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.ob-l .logo{color:#fff;padding:0}
.ob-l .logo .mk{background:#3DAE7F;color:#08251A}
.ob-l h2{color:#fff;font-size:30px;line-height:1.1;font-weight:600}
.ob-l p{color:#A9C8B8;max-width:36ch}
.ob-steps{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ob-step{display:flex;gap:12px;align-items:center;padding:9px 0;color:#89AE9B;font-size:14px}
.ob-step i{width:26px;height:26px;border-radius:50%;border:1.5px solid #3C6A55;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;flex:none}
.ob-step.on{color:#fff} .ob-step.on i{border-color:#7FD8AF;color:#7FD8AF}
.ob-step.done i{background:#3DAE7F;border-color:#3DAE7F;color:#08251A}
.ob-quote{margin-top:auto;border-top:1px solid #24563F;padding-top:20px;font-size:13px;color:#A9C8B8}
.ob-quote b{color:#fff;font-weight:600}
.ob-rings{position:absolute;right:-120px;bottom:120px;width:300px;height:300px;border-radius:50%;border:1px solid #1E5A42;pointer-events:none}
.ob-rings::after{content:"";position:absolute;inset:40px;border-radius:50%;border:1px solid #1E5A42}
.ob-r{padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;background:var(--bg)}
.ob-card{width:100%;max-width:720px;display:flex;flex-direction:column;gap:22px}
.ob-card h1{font-size:28px}
.ob-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prof-card{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:border-color .15s,box-shadow .15s}
.prof-card:hover{border-color:var(--brand)}
.prof-card.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.prof-card .pc-i{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center}
.prof-card.on .pc-i{background:var(--brand);color:var(--brand-ink)}
.prof-card b{font-weight:600;font-size:14px}
.prof-card small{color:var(--muted);font-size:12px;line-height:1.4}
.opt-card{border:1px solid var(--line-2);border-radius:12px;padding:16px;background:var(--surface);display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.opt-card.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.opt-card .oi{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--brand-strong)}
.photo-drop{display:flex;align-items:center;gap:16px;padding:14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface)}
.hours{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.hour-row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.hour-row:last-child{border-bottom:0}
.hour-row .row{flex-wrap:nowrap}
.hour-row input.input{width:96px}
@media (max-width:860px){.ob{grid-template-columns:1fr}.ob-l{padding:24px max(16px,env(safe-area-inset-left,0px));gap:14px}.ob-l .ob-steps,.ob-quote,.ob-rings,.ob-l p{display:none}.ob-l h2{font-size:20px}}
@media (max-width:520px){.hour-row{grid-template-columns:1fr}}

/* ---------- Agenda ---------- */
.ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-title{font-family:var(--f-display);font-size:18px;font-weight:600;min-width:180px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-scroll{overflow-x:auto}
.tg{display:grid;position:relative}
.tg-head{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.tg-head div{padding:10px 8px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
.tg-head div b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:600}
.tg-head div.today b{color:#fff;background:var(--accent);border-radius:8px;width:34px;margin:2px auto 0}
.tg-body{display:grid;position:relative}
.tg-hours{border-right:1px solid var(--line)}
.tg-hours div{height:56px;font-size:11px;color:var(--muted);text-align:right;padding:2px 8px 0 0;font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 56px}
.tg-col.today{background-color:color-mix(in srgb,var(--brand-soft) 35%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;border:0;text-align:left;background:var(--brand-soft);color:var(--brand-strong);border-left:3px solid var(--brand);cursor:pointer;z-index:1}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.s-confirmado{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.ev.s-agendado{background:var(--info-soft);color:var(--info);border-left-color:var(--info)}
.ev.s-concluido{background:var(--surface-3);color:var(--ink-2);border-left-color:var(--muted)}
.ev.s-cancelado{background:var(--surface-2);color:var(--muted);border-left-color:var(--line-2);text-decoration:line-through}
.ev.s-faltou{background:var(--bad-soft);color:var(--bad);border-left-color:var(--bad)}
.ev:hover{filter:brightness(.97);z-index:3}
.free{position:absolute;left:4px;right:4px;border:1px dashed var(--line-2);border-radius:7px;font-size:11.5px;color:var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.75}
.free:hover{border-color:var(--brand);color:var(--brand);opacity:1}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.month .mh{padding:9px;font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);text-align:center}
.mday{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;background:none;border-top:0;border-left:0;text-align:left;min-width:0}
.mday:nth-child(7n){border-right:0}
.mday:hover{background:var(--surface-2)}
.mday.out{opacity:.45}
.mday .dn{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.mday.today .dn{background:var(--accent);color:#fff}
.mday .me{font-size:11px;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mday .more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:720px){.mday{min-height:62px}.mday .me{display:none}.mday .cnt{display:block}}
.mday .cnt{display:none;font-size:11px;color:var(--brand);font-weight:600}

/* ---------- Odontograma ---------- */
.odg{display:flex;flex-direction:column;gap:22px;align-items:center;padding:22px 10px;overflow-x:auto}
.arch{display:flex;gap:18px;justify-content:center}
.quad{display:flex;gap:4px}
.tooth{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:3px;border-radius:8px}
.tooth.sel{background:var(--brand-soft)}
.tooth .tn{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tooth svg polygon,.tooth svg rect{stroke:var(--line-2);stroke-width:1;cursor:pointer;transition:fill .1s}
.tooth svg .f{fill:var(--surface)} .tooth svg .f:hover{fill:var(--surface-3)}
.tooth svg .carie{fill:#E0675F} .tooth svg .restauracao{fill:#4A8BD6} .tooth svg .selante{fill:#6CC497}
.odg-mid{width:100%;max-width:760px;border-top:1px dashed var(--line-2);position:relative}
.odg-mid span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--surface);padding:0 10px;font-size:11px;color:var(--muted)}
.tool{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500}
.tool.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tool i{width:12px;height:12px;border-radius:3px;display:block}
@media (max-width:820px){.arch{gap:8px}.quad{gap:1px}.tooth{padding:1px}.tooth svg{width:26px;height:26px}}
@media (max-width:480px){.arch{flex-direction:column;align-items:center;gap:6px}}

/* ---------- Meal plan ---------- */
.meal{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal-t{padding:16px 0 16px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;position:relative}
.meal-t input{width:62px;height:28px;border:1px solid transparent;border-radius:6px;background:var(--surface-2);font-weight:600;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.meal-t input:focus{border-color:var(--brand);outline:none}
.meal-b{padding:14px 16px;min-width:0}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto auto 30px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.food:last-of-type{border-bottom:0}
.food small{color:var(--muted)}
.ring{--p:50;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.macro{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.macro .bar>i{background:var(--c)}

/* ---------- Training ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.ex-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ex-art{aspect-ratio:16/10;max-width:100%;display:block;width:100%}
.ex-card .ex-i{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ex-card b{font-weight:600}
.ex-row{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 62px 74px 74px 30px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ex-row .input{height:32px;padding:0 8px;font-size:13px}
.ex-row .thumb{width:56px;height:40px;border-radius:6px;overflow:hidden}
.ex-row .ord{display:flex;flex-direction:column}
.ex-row .ord button{height:16px;border:0;background:none;color:var(--muted);padding:0;display:grid;place-items:center}
.ex-row .ord button:hover{color:var(--ink)}
.ex-row .nm b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row .nm input{margin-top:4px}
.ex-head{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 62px 74px 74px 30px;gap:8px;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:720px){.ex-head{display:none}.ex-row{grid-template-columns:28px 1fr 30px}.ex-row .thumb{display:none}.ex-row .sets{grid-column:2;display:flex;gap:6px}}
.ex-row .sets{display:contents}
@media (max-width:720px){.ex-row .sets{display:flex}.ex-row .sets .input{width:33%}}
.lib-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:9px;border:1px solid transparent;width:100%;background:none;text-align:left}
.lib-item:hover{background:var(--surface-2);border-color:var(--line)}
.lib-item .thumb{width:54px;height:38px;border-radius:6px;overflow:hidden;flex:none}
.lib-item b{display:block;font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:150px;min-width:0}
.wday:hover{border-color:var(--line-2)}
.wday.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wday .wd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.wday .wd .tdy{font-size:10px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:99px}
.wday b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.2}
.wday.rest b{color:var(--muted)}
.wday select{margin-top:auto}
.per-hero{background:#14201A;color:#DCE8E1;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.per-hero h3{color:#fff}
.per-hero .ph-it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;background:#1C2C24}
.per-hero .ph-it small{color:#93A89C;display:block;font-size:12px}
.per-hero .ph-it b{color:#fff;font-weight:600}
.per-hero .big{font-family:var(--f-display);font-size:20px;color:#FFB38A;font-weight:600;font-variant-numeric:tabular-nums;width:54px;flex:none}

/* ---------- Treatments / timeline ---------- */
.trat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:center;padding:5px 6px;border-radius:7px;border:0;background:none;text-align:left;font-size:13px;color:var(--ink-2);width:100%}
.step:hover{background:var(--surface-2)}
.step .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.step.done{color:var(--muted);text-decoration:line-through}
.step.done .cb{background:var(--brand);border-color:var(--brand)}
.tl{display:flex;flex-direction:column;position:relative}
.tl-it{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.tl-it::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl-it:last-child::before{display:none}
.tl-dot{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);border:2px solid var(--brand);margin-top:1px}
.tl-it .tl-c{background:var(--surface-2);border-radius:10px;padding:11px 13px;min-width:0}
.tl-it .tl-c p{color:var(--ink-2);margin-top:4px;font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv div small{display:block;font-size:11.5px;color:var(--muted)}
.kv div b{font-weight:600;font-size:13.5px}
.dl{display:flex;flex-direction:column;gap:2px}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- Site editor + public page ---------- */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
@media (max-width:1100px){.ed{grid-template-columns:1fr}}
.ed-prev{position:sticky;top:84px;display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:340px;max-width:100%;height:690px;border-radius:44px;background:#0E1512;padding:11px;box-shadow:var(--shadow-lg)}
.phone-in{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff;position:relative}
.phone-in .scroll{height:100%;overflow-y:auto}
.phone-notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:99px;background:#0E1512;z-index:5}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl button{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;text-align:left}
.tpl button.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tpl .mini{height:64px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 100px 30px;gap:8px;align-items:center}
@media (max-width:560px){.svc-row{grid-template-columns:1fr 1fr 30px}.svc-row .input:first-child{grid-column:1/-1}}
.sec{display:flex;flex-direction:column;gap:14px;padding:18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h3{font-size:15px}

/* public page — always light, its own palette driven by --pc */
.pub{--pc:#1C7A56;--pc-soft:color-mix(in srgb,var(--pc) 12%,#fff);color:#17211C;background:#fff;font-family:var(--f-body);min-height:100%}
.pub h1,.pub h2,.pub h3{color:#17211C}
.pub .p-cover{height:120px;background:var(--pc);position:relative}
.pub .p-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 45%)}
.pub .p-head{padding:0 20px;margin-top:-44px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pub .p-av{width:88px;height:88px;border-radius:50%;border:4px solid #fff;background:var(--pc-soft);color:var(--pc);display:grid;place-items:center;font-weight:700;font-size:28px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pub .p-av img{width:100%;height:100%;object-fit:cover}
.pub.t-moderno .p-cover{height:auto;padding:46px 20px 26px;display:flex;gap:14px;align-items:center;color:#fff}
.pub.t-moderno .p-cover h1,.pub.t-moderno .p-cover p{color:#fff}
.pub.t-moderno .p-av{width:72px;height:72px;font-size:22px;border-width:3px}
.pub.t-minimal .p-cover{display:none}
.pub.t-minimal .p-head{margin-top:0;padding-top:46px;align-items:flex-start;text-align:left}
.pub.t-minimal .p-av{border:0;box-shadow:none}
.pub .p-name{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.pub .p-spec{color:var(--pc);font-weight:600;font-size:13px}
.pub .p-meta{color:#5D6B64;font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.pub .p-meta span{display:inline-flex;align-items:center;gap:4px}
.pub.t-minimal .p-meta{justify-content:flex-start}
.pub .p-sec{padding:18px 20px;border-top:1px solid #EEF1EF;display:flex;flex-direction:column;gap:10px}
.pub .p-sec h3{font-size:14px;font-weight:600}
.pub .p-sec p{color:#47544D;font-size:13.5px;line-height:1.55}
.pub .p-svc{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #E5EAE7;border-radius:12px;background:#fff;text-align:left;width:100%;color:#17211C}
.pub .p-svc:hover{border-color:var(--pc)}
.pub .p-svc.on{border-color:var(--pc);box-shadow:0 0 0 3px var(--pc-soft)}
.pub .p-svc b{display:block;font-weight:600;font-size:13.5px}
.pub .p-svc small{color:#6A776F;font-size:12px}
.pub .p-price{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.pub .p-btn{height:46px;border-radius:12px;border:0;background:var(--pc);color:#fff;font-weight:600;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.pub .p-btn.alt{background:#fff;color:#17211C;border:1px solid #DCE3DF}
.pub .p-btn[disabled]{opacity:.45}
.pub .p-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:var(--pc-soft);color:var(--pc);font-size:12px;font-weight:600}
.pub .p-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pub .p-day{flex:none;width:58px;height:70px;border-radius:12px;border:1px solid #E5EAE7;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#17211C}
.pub .p-day small{font-size:11px;color:#6A776F;text-transform:capitalize}
.pub .p-day b{font-size:18px;font-weight:700}
.pub .p-day.on{background:var(--pc);border-color:var(--pc);color:#fff} .pub .p-day.on small{color:rgba(255,255,255,.85)}
.pub .p-day[disabled]{opacity:.35}
.pub .p-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pub .p-slot{height:40px;border-radius:10px;border:1px solid #E5EAE7;background:#fff;font-weight:600;font-variant-numeric:tabular-nums;color:#17211C}
.pub .p-slot.on{background:var(--pc);border-color:var(--pc);color:#fff}
.pub .p-slot[disabled]{text-decoration:line-through;opacity:.4}
.pub .p-in{height:44px;border-radius:10px;border:1px solid #DCE3DF;padding:0 12px;width:100%;background:#fff;color:#17211C}
.pub .p-in:focus{outline:none;border-color:var(--pc);box-shadow:0 0 0 3px var(--pc-soft)}
.pub .p-lbl{font-size:12.5px;font-weight:600;color:#3C4A43}
.pub .p-steps{display:flex;gap:4px}
.pub .p-steps i{flex:1;height:4px;border-radius:99px;background:#E6EBE8}
.pub .p-steps i.on{background:var(--pc)}
.pub .p-ok{width:64px;height:64px;border-radius:50%;background:var(--pc-soft);color:var(--pc);display:grid;place-items:center;margin:0 auto}
.pub .p-sum{background:#F5F8F6;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.pub .p-sum div{display:flex;justify-content:space-between;gap:12px}
.pub .p-sum span{color:#6A776F}
.pub .p-foot{padding:22px 20px 30px;text-align:center;font-size:11.5px;color:#8A968F}
.pub-shell{min-height:100vh;background:#E9EEEB;display:flex;flex-direction:column}
.pub-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:#13201A;color:#DCE8E1;font-size:13px;flex-wrap:wrap}
.pub-bar .btn{background:#1F3029;border-color:#2D4238;color:#fff}
.pub-bar code{font-family:var(--f-body);color:#9FE0C0}
.pub-main{flex:1;display:flex;justify-content:center;padding:24px 0 40px}
.pub-col{width:100%;max-width:480px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px -30px rgba(0,0,0,.35)}
@media (max-width:520px){.pub-main{padding:0}.pub-col{border-radius:0;box-shadow:none}}
.wa{background:#1FA855!important}

const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
function evBlock(a){const top=(toMin(a.time)-H0*60)/60*HH,h=Math.max(26,a.dur/60*HH-3);const c=cli(a.cid)||{name:'—'};return `<button type="button" class="ev s-${a.status}" style="top:${top}px;height:${h}px" data-a="openAppt" data-id="${a.id}" title="${esc(a.time+' · '+c.name+' · '+a.type)}"><b>${a.time} ${esc(first(c.name))}</b>${h>34?`<span>${esc(a.type)}</span>`:''}</button>`}
function nowLine(dIso){if(dIso!==TODAY_ISO)return'';const m=toMin(nowHM());if(m<H0*60||m>H1*60)return'';return `<div class="now-line" style="top:${(m-H0*60)/60*HH}px"></div>`}
function freeSlots(dIso){const D=getDB();const d=parse(dIso);const h=D.hours[WEEK[(d.getDay()+6)%7]];if(!h||!h[0])return[];if(dIso<TODAY_ISO)return[];
 const busy=D.appts.filter(a=>a.date===dIso&&live(a)&&agFilter(a)).map(a=>[toMin(a.time),toMin(a.time)+a.dur]);const out=[];const now=dIso===TODAY_ISO?toMin(nowHM()):0;

 if(t.dataset.file&&t.files&&t.files[0]){const f=t.files[0];if(!f.type.startsWith('image/')){toast('Escolha um arquivo de imagem','err');return}if(f.size>4e6){toast('Imagem acima de 4 MB. Escolha uma menor.','err');return}const r=new FileReader();r.onload=()=>{setPath(t.dataset.file,r.result);toast('Imagem atualizada');render()};r.readAsDataURL(f)}});

 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.a){e.preventDefault();e.target.click()}});
