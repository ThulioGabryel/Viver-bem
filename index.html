<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
</head>
<body>
<title>ViverBem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar + topbar SaaS shell; onboarding split; public booking page is a phone-first column. */
:root{
  --bg:#F4F7F5; --surface:#FFFFFF; --surface-2:#EFF4F1; --surface-3:#E6EEE9;
  --ink:#13201A; --ink-2:#34463D; --muted:#64756C; --line:#E0E8E3; --line-2:#CFDBD4;
  --brand:#1C7A56; --brand-ink:#FFFFFF; --brand-soft:#E2F1E9; --brand-strong:#125C40;
  --accent:#1C7A56; --accent-soft:#E2F1E9; --accent-ink:#FFFFFF;
  --ok:#1D8549; --ok-soft:#E1F3E8; --warn:#A86A12; --warn-soft:#FBF0DA; --bad:#BE3D36; --bad-soft:#FBE6E4; --info:#2B67A6; --info-soft:#E4EDF8; --violet:#6B4FA6; --violet-soft:#EEE8F8;
  --side-bg:#FFFFFF; --side-ink:#34463D; --side-muted:#7A8A82; --side-active:#E2F1E9; --side-active-ink:#125C40; --side-line:#E0E8E3;
  --scrim:rgba(14,24,19,.42);
  --shadow:0 1px 2px rgba(19,32,26,.05),0 10px 30px -14px rgba(19,32,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(19,32,26,.35);
  --r-sm:6px; --r:9px; --r-lg:13px;
  --f-display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (max-width:0px){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
  --ink:#E4EEE8; --ink-2:#BFCEC6; --muted:#8C9C94; --line:#24312B; --line-2:#31413A;
  --brand:#3DAE7F; --brand-ink:#04140C; --brand-soft:#16332A; --brand-strong:#77D3AA;
  --accent:#3DAE7F; --accent-soft:#16332A; --accent-ink:#04140C;
  --ok:#52C487; --ok-soft:#163323; --warn:#E0A645; --warn-soft:#352914; --bad:#EE7C74; --bad-soft:#3A1C1A; --info:#78AEE6; --info-soft:#18283C; --violet:#B39BE6; --violet-soft:#2A2340;
  --side-bg:#121A16; --side-ink:#BFCEC6; --side-muted:#7E8E86; --side-active:#16332A; --side-active-ink:#86DDB6; --side-line:#24312B;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="__off"]{
  --bg:#0E1512; --surface:#151E1A; --surface-2:#1A2520; --surface-3:#223029;
  --ink:#E4EEE8; --ink-2:#BFCEC6; --muted:#8C9C94; --line:#24312B; --line-2:#31413A;
  --brand:#3DAE7F; --brand-ink:#04140C; --brand-soft:#16332A; --brand-strong:#77D3AA;
  --accent:#3DAE7F; --accent-soft:#16332A; --accent-ink:#04140C;
  --ok:#52C487; --ok-soft:#163323; --warn:#E0A645; --warn-soft:#352914; --bad:#EE7C74; --bad-soft:#3A1C1A; --info:#78AEE6; --info-soft:#18283C; --violet:#B39BE6; --violet-soft:#2A2340;
  --side-bg:#121A16; --side-ink:#BFCEC6; --side-muted:#7E8E86; --side-active:#16332A; --side-active-ink:#86DDB6; --side-line:#24312B;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark }
/* Personal trainer: its own energy — dark rail, ember accent */
.app[data-prof="per"]{ --accent:#D9581F; --accent-soft:#FCE9DE; --accent-ink:#FFFFFF; --side-active:#FCE9DE; --side-active-ink:#B04A16 }
@media (max-width:0px){ :root:not([data-theme="light"]) .app[data-prof="per"]{ --accent:#F07A43; --accent-soft:#3A2116; --accent-ink:#1A0A03; --side-active:#3A2116; --side-active-ink:#FFB38A } }
:root[data-theme="__off"] .app[data-prof="per"]{ --accent:#F07A43; --accent-soft:#3A2116; --accent-ink:#1A0A03; --side-active:#3A2116; --side-active-ink:#FFB38A }

:root{color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:26px;line-height:1.15} h2{font-size:19px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .row.nw{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.hide-m{}
@media (max-width:720px){.hide-m{display:none!important}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
:root[data-theme="__off"] .btn.pri:hover{color:var(--brand-ink)}
.app[data-prof="per"] .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.app[data-prof="per"] .btn.pri:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:5px}
.btn.icon{width:36px;padding:0}
.btn.icon.sm{width:30px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea.input{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input.sm{height:32px;font-size:13px}
.input-ic{position:relative} .input-ic .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)} .input-ic .input{padding-left:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}
.err{color:var(--bad);font-size:12.5px}
.prefix{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.prefix span{padding:0 10px;display:flex;align-items:center;background:var(--surface-2);color:var(--muted);font-size:12.5px;white-space:nowrap;border-right:1px solid var(--line)}
.prefix .input{border:0;border-radius:0}
.toggle{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line-2);border:0;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--brand)} .toggle.on::after{transform:translateX(16px)}

/* ---------- Chips, pills ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .cnt{font-size:11px;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.vio{background:var(--violet-soft);color:var(--violet)} .pill.brand{background:var(--brand-soft);color:var(--brand-strong)}
.pill.plain::before{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}

/* ---------- Avatar ---------- */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;background:var(--brand-soft);color:var(--brand-strong);overflow:hidden;letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:56px;height:56px;font-size:18px} .av.xl{width:84px;height:84px;font-size:26px} .av.sm{width:28px;height:28px;font-size:11px}
.av.t1{background:#E4EEF8;color:#2B5F96}.av.t2{background:#F6EADB;color:#8A5517}.av.t3{background:#EEE8F8;color:#5E4596}.av.t4{background:#F9E4E2;color:#A3392F}.av.t5{background:#E2F1E9;color:#125C40}
:root[data-theme="__off"] .av.t1{background:#1B2B3E;color:#9CC4EE}:root[data-theme="__off"] .av.t2{background:#33281A;color:#E8B97C}:root[data-theme="__off"] .av.t3{background:#2A2340;color:#C2AEEC}:root[data-theme="__off"] .av.t4{background:#3A1F1D;color:#F0A39D}:root[data-theme="__off"] .av.t5{background:#16332A;color:#86DDB6}
@media (max-width:0px){:root:not([data-theme="light"]) .av.t1{background:#1B2B3E;color:#9CC4EE}:root:not([data-theme="light"]) .av.t2{background:#33281A;color:#E8B97C}:root:not([data-theme="light"]) .av.t3{background:#2A2340;color:#C2AEEC}:root:not([data-theme="light"]) .av.t4{background:#3A1F1D;color:#F0A39D}:root:not([data-theme="light"]) .av.t5{background:#16332A;color:#86DDB6}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:var(--side-bg);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px));color:var(--side-ink)}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--side-ink)}
.app[data-prof] .logo b{color:var(--side-ink)}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff}
.prof-badge{margin:0 4px 14px;padding:10px;border-radius:var(--r);border:1px solid var(--side-line);display:flex;gap:10px;align-items:center;background:transparent;width:calc(100% - 8px);text-align:left;color:var(--side-ink)}
.prof-badge:hover{background:var(--side-active)}
.prof-badge .pi{width:32px;height:32px;border-radius:8px;background:var(--side-active);color:var(--side-active-ink);display:grid;place-items:center;flex:none}
.prof-badge b{display:block;font-size:13px;font-weight:600}
.prof-badge small{display:block;font-size:11.5px;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--side-ink);font-weight:500;font-size:13.5px;text-align:left;width:100%}
.nav button:hover{background:var(--side-active)}
.nav button.on{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
.nav button .ic{opacity:.85}
.side-foot{margin-top:auto;padding-top:14px}
.site-card{border-radius:var(--r);padding:12px;background:var(--side-active);font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.site-card code{font-family:var(--f-body);font-size:11.5px;color:var(--side-active-ink);word-break:break-all}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:62px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.top .gsearch{flex:1;max-width:420px;position:relative}
.top .burger{display:none}
.content{padding-block:26px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(0px,1.6vw,18px)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;z-index:70;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow-lg);padding-top:max(18px,env(safe-area-inset-top,0px))}
  .app.menu .side{transform:none}
  .top .burger{display:inline-flex}
}

/* demo switch */
.demo-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 8px;border-radius:var(--r);border:1px dashed var(--line-2);background:transparent;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.demo-btn:hover{background:var(--surface-2)}
.demo-btn .dot{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* ---------- Page head ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph .sub{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .input-ic{width:280px;max-width:100%}
@media (max-width:640px){.toolbar .input-ic{width:100%}}

/* ---------- Cards / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px}
.panel-b{padding:16px}
.panel-b.tight{padding:6px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.layout.wide-r{grid-template-columns:minmax(0,1fr) 420px}
.layout.l-side{grid-template-columns:300px minmax(0,1fr)}
@media (max-width:1180px){.layout,.layout.wide-r{grid-template-columns:1fr}}
@media (max-width:900px){.layout.l-side{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* KPI strip: a single bordered band, divided cells (not floating tiles) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:18px}
.kpi{padding:15px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-l{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:500}
.kpi .k-l .ic{color:var(--accent)}
.kpi .k-v{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v.sm{font-size:17px}
.kpi .k-s{font-size:11.5px;color:var(--muted)}
.kpi .k-s .up{color:var(--ok);font-weight:600} .kpi .k-s .dn{color:var(--bad);font-weight:600}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .who{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .who b{font-weight:600;display:block;white-space:nowrap}
.tbl .who small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.tbl .act{text-align:right;white-space:nowrap}
.tbl .r{text-align:right}
@media (max-width:720px){
  table.tbl.cards thead{display:none}
  table.tbl.cards,table.tbl.cards tbody,table.tbl.cards tr,table.tbl.cards td{display:block;width:100%}
  table.tbl.cards tr{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  table.tbl.cards td{padding:0;border:0}
  table.tbl.cards td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  table.tbl.cards td.full{grid-column:1/-1}
  table.tbl.cards td.act{grid-column:1/-1;text-align:left}
  .tbl .r{text-align:left}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* list rows */
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface-2)}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;width:46px;flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.app[data-prof="per"] .bar>i{background:var(--accent)}

/* empty / skeleton */
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.empty .ei{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:4px}
.empty b{color:var(--ink);font-weight:600}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.1s infinite linear;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* tabs / segmented */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:38px;padding:0 12px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{height:28px;padding:0 11px;border-radius:6px;border:0;background:transparent;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- Overlays ---------- */
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:var(--scrim);animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.modal.lg{max-width:820px} .modal.sm{max-width:420px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal-h p{color:var(--muted);font-size:13px;margin-top:3px}
.modal-b{padding:6px 20px 18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer-wrap{position:fixed;inset:0;z-index:75;background:var(--scrim);animation:fade .15s}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.drawer-b{flex:1;overflow-y:auto;padding:16px 20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}} @keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.modal,.drawer,.modal-wrap,.drawer-wrap{animation:none}}
.dd{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;animation:pop .12s}
.dd button.it{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13.5px}
.dd button.it:hover{background:var(--surface-2)}
.dd button.it.on{background:var(--brand-soft);color:var(--brand-strong);font-weight:600}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.dd-h{padding:8px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rel{position:relative}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:11px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:pop .2s;max-width:380px}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;flex:none}
.toast.err .ti{background:var(--bad)}
.toast.info .ti{background:var(--info)}
.loader{position:fixed;inset:0;z-index:120;background:var(--bg);display:grid;place-items:center}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Onboarding ---------- */
.ob{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);min-height:100vh}
.ob-l{background:#123D2D;color:#DCEDE3;padding:40px 36px 32px max(36px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.ob-l .logo{color:#fff;padding:0}
.ob-l .logo .mk{background:#3DAE7F;color:#08251A}
.ob-l h2{color:#fff;font-size:30px;line-height:1.1;font-weight:600}
.ob-l p{color:#A9C8B8;max-width:36ch}
.ob-steps{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ob-step{display:flex;gap:12px;align-items:center;padding:9px 0;color:#89AE9B;font-size:14px}
.ob-step i{width:26px;height:26px;border-radius:50%;border:1.5px solid #3C6A55;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;flex:none}
.ob-step.on{color:#fff} .ob-step.on i{border-color:#7FD8AF;color:#7FD8AF}
.ob-step.done i{background:#3DAE7F;border-color:#3DAE7F;color:#08251A}
.ob-quote{margin-top:auto;border-top:1px solid #24563F;padding-top:20px;font-size:13px;color:#A9C8B8}
.ob-quote b{color:#fff;font-weight:600}
.ob-rings{position:absolute;right:-120px;bottom:120px;width:300px;height:300px;border-radius:50%;border:1px solid #1E5A42;pointer-events:none}
.ob-rings::after{content:"";position:absolute;inset:40px;border-radius:50%;border:1px solid #1E5A42}
.ob-r{padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;background:var(--bg)}
.ob-card{width:100%;max-width:720px;display:flex;flex-direction:column;gap:22px}
.ob-card h1{font-size:28px}
.ob-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prof-card{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;transition:border-color .15s,box-shadow .15s}
.prof-card:hover{border-color:var(--brand)}
.prof-card.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.prof-card .pc-i{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center}
.prof-card.on .pc-i{background:var(--brand);color:var(--brand-ink)}
.prof-card b{font-weight:600;font-size:14px}
.prof-card small{color:var(--muted);font-size:12px;line-height:1.4}
.opt-card{border:1px solid var(--line-2);border-radius:12px;padding:16px;background:var(--surface);display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.opt-card.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.opt-card .oi{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--brand-strong)}
.photo-drop{display:flex;align-items:center;gap:16px;padding:14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface)}
.hours{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.hour-row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.hour-row:last-child{border-bottom:0}
.hour-row .row{flex-wrap:nowrap}
.hour-row input.input{width:96px}
@media (max-width:860px){.ob{grid-template-columns:1fr}.ob-l{padding:24px max(16px,env(safe-area-inset-left,0px));gap:14px}.ob-l .ob-steps,.ob-quote,.ob-rings,.ob-l p{display:none}.ob-l h2{font-size:20px}}
@media (max-width:520px){.hour-row{grid-template-columns:1fr}}

/* ---------- Agenda ---------- */
.ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-title{font-family:var(--f-display);font-size:18px;font-weight:600;min-width:180px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-scroll{overflow-x:auto}
.tg{display:grid;position:relative}
.tg-head{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.tg-head div{padding:10px 8px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--line)}
.tg-head div b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:600}
.tg-head div.today b{color:#fff;background:var(--accent);border-radius:8px;width:34px;margin:2px auto 0}
.tg-body{display:grid;position:relative}
.tg-hours{border-right:1px solid var(--line)}
.tg-hours div{height:56px;font-size:11px;color:var(--muted);text-align:right;padding:2px 8px 0 0;font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 56px}
.tg-col.today{background-color:color-mix(in srgb,var(--brand-soft) 35%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;border:0;text-align:left;background:var(--brand-soft);color:var(--brand-strong);border-left:3px solid var(--brand);cursor:pointer;z-index:1}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.s-confirmado{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.ev.s-agendado{background:var(--info-soft);color:var(--info);border-left-color:var(--info)}
.ev.s-concluido{background:var(--surface-3);color:var(--ink-2);border-left-color:var(--muted)}
.ev.s-cancelado{background:var(--surface-2);color:var(--muted);border-left-color:var(--line-2);text-decoration:line-through}
.ev.s-faltou{background:var(--bad-soft);color:var(--bad);border-left-color:var(--bad)}
.ev:hover{filter:brightness(.97);z-index:3}
.free{position:absolute;left:4px;right:4px;border:1px dashed var(--line-2);border-radius:7px;font-size:11.5px;color:var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.75}
.free:hover{border-color:var(--brand);color:var(--brand);opacity:1}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.month .mh{padding:9px;font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);text-align:center}
.mday{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;background:none;border-top:0;border-left:0;text-align:left;min-width:0}
.mday:nth-child(7n){border-right:0}
.mday:hover{background:var(--surface-2)}
.mday.out{opacity:.45}
.mday .dn{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.mday.today .dn{background:var(--accent);color:#fff}
.mday .me{font-size:11px;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mday .more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:720px){.mday{min-height:62px}.mday .me{display:none}.mday .cnt{display:block}}
.mday .cnt{display:none;font-size:11px;color:var(--brand);font-weight:600}

/* ---------- Odontograma ---------- */
.odg{display:flex;flex-direction:column;gap:22px;align-items:center;padding:22px 10px;overflow-x:auto}
.arch{display:flex;gap:18px;justify-content:center}
.quad{display:flex;gap:4px}
.tooth{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:3px;border-radius:8px}
.tooth.sel{background:var(--brand-soft)}
.tooth .tn{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tooth svg polygon,.tooth svg rect{stroke:var(--line-2);stroke-width:1;cursor:pointer;transition:fill .1s}
.tooth svg .f{fill:var(--surface)} .tooth svg .f:hover{fill:var(--surface-3)}
.tooth svg .carie{fill:#E0675F} .tooth svg .restauracao{fill:#4A8BD6} .tooth svg .selante{fill:#6CC497}
.odg-mid{width:100%;max-width:760px;border-top:1px dashed var(--line-2);position:relative}
.odg-mid span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--surface);padding:0 10px;font-size:11px;color:var(--muted)}
.tool{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:500}
.tool.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tool i{width:12px;height:12px;border-radius:3px;display:block}
@media (max-width:820px){.arch{gap:8px}.quad{gap:1px}.tooth{padding:1px}.tooth svg{width:26px;height:26px}}
@media (max-width:480px){.arch{flex-direction:column;align-items:center;gap:6px}}

/* ---------- Meal plan ---------- */
.meal{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal-t{padding:16px 0 16px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;position:relative}
.meal-t input{width:62px;height:28px;border:1px solid transparent;border-radius:6px;background:var(--surface-2);font-weight:600;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.meal-t input:focus{border-color:var(--brand);outline:none}
.meal-b{padding:14px 16px;min-width:0}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto auto 30px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.food:last-of-type{border-bottom:0}
.food small{color:var(--muted)}
.ring{--p:50;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.macro{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.macro .bar>i{background:var(--c)}

/* ---------- Training ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.ex-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ex-art{aspect-ratio:16/10;max-width:100%;display:block;width:100%}
.ex-card .ex-i{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ex-card b{font-weight:600}
.ex-row{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 62px 74px 74px 30px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ex-row .input{height:32px;padding:0 8px;font-size:13px}
.ex-row .thumb{width:56px;height:40px;border-radius:6px;overflow:hidden}
.ex-row .ord{display:flex;flex-direction:column}
.ex-row .ord button{height:16px;border:0;background:none;color:var(--muted);padding:0;display:grid;place-items:center}
.ex-row .ord button:hover{color:var(--ink)}
.ex-row .nm b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row .nm input{margin-top:4px}
.ex-head{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 62px 74px 74px 30px;gap:8px;padding:8px 12px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:720px){.ex-head{display:none}.ex-row{grid-template-columns:28px 1fr 30px}.ex-row .thumb{display:none}.ex-row .sets{grid-column:2;display:flex;gap:6px}}
.ex-row .sets{display:contents}
@media (max-width:720px){.ex-row .sets{display:flex}.ex-row .sets .input{width:33%}}
.lib-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:9px;border:1px solid transparent;width:100%;background:none;text-align:left}
.lib-item:hover{background:var(--surface-2);border-color:var(--line)}
.lib-item .thumb{width:54px;height:38px;border-radius:6px;overflow:hidden;flex:none}
.lib-item b{display:block;font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:150px;min-width:0}
.wday:hover{border-color:var(--line-2)}
.wday.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wday .wd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.wday .wd .tdy{font-size:10px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:99px}
.wday b{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.2}
.wday.rest b{color:var(--muted)}
.wday select{margin-top:auto}
.per-hero{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.per-hero h3{color:var(--ink)}
.per-hero .ph-it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;background:var(--surface-2);color:var(--ink)}
.per-hero .ph-it small{color:var(--muted);display:block;font-size:12px}
.per-hero .ph-it b{color:var(--ink);font-weight:600}
.per-hero .big{font-family:var(--f-display);font-size:20px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;width:54px;flex:none}

/* ---------- Treatments / timeline ---------- */
.trat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;align-items:center;padding:5px 6px;border-radius:7px;border:0;background:none;text-align:left;font-size:13px;color:var(--ink-2);width:100%}
.step:hover{background:var(--surface-2)}
.step .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.step.done{color:var(--muted);text-decoration:line-through}
.step.done .cb{background:var(--brand);border-color:var(--brand)}
.tl{display:flex;flex-direction:column;position:relative}
.tl-it{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.tl-it::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl-it:last-child::before{display:none}
.tl-dot{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);border:2px solid var(--brand);margin-top:1px}
.tl-it .tl-c{background:var(--surface-2);border-radius:10px;padding:11px 13px;min-width:0}
.tl-it .tl-c p{color:var(--ink-2);margin-top:4px;font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv div small{display:block;font-size:11.5px;color:var(--muted)}

 const max=Math.max(1,...data.flatMap(d=>keys.map(k=>d[k]||0)));const nice=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/nice)*nice;
 const iw=W-L-R,ih=H-T-B,bw=iw/data.length,gw=Math.min(bw*.62,o.bw||44);const kw=gw/keys.length;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
 for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;const v=top*i/4;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${o.money?moneyK(v).replace('R$ ',''):nfmt(v,0)}</text>`}
 data.forEach((d,i)=>{const x=L+bw*i+(bw-gw)/2;keys.forEach((k,j)=>{const h=ih*(d[k]||0)/top;const last=o.hl&&i===data.length-1;s+=`<rect x="${x+kw*j+1}" y="${T+ih-h}" width="${kw-2}" height="${Math.max(h,0)}" rx="3" fill="${j===0&&last?'var(--accent)':cols[j]}"${j===0&&!last&&o.hl?' opacity=".55"':''}><title>${d.l}: ${o.money?money(d[k]):d[k]}</title></rect>`});s+=`<text x="${L+bw*i+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`});

 const iw=W-L-R,ih=H-T-B;const X=i=>L+iw*i/Math.max(1,pts.length-1),Y=v=>T+ih-(v-mn)/(mx-mn)*ih;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;

function fieldHTML(f,val,pre='f'){const id=pre+'-'+f.k;const req=f.req?'required':'';let inp;
 if(f.t==='select')inp=sel(id,f.o,val??f.o[0],{name:f.k});
 else if(f.t==='client'){const cl=getDB().clients;inp=sel(id,cl.map(c=>[c.id,c.name]),val??cl[0].id,{name:f.k})}
 else if(f.t==='textarea')inp=`<textarea class="input" id="${id}" name="${f.k}" ${req} placeholder="${esc(f.ph||'')}">${esc(val??'')}</textarea>`;
 else inp=`<input class="input" id="${id}" name="${f.k}" ${req} type="${f.t==='date'?'date':f.t==='time'?'time':f.t==='number'||f.t==='money'?'number':'text'}" ${f.t==='money'||f.t==='number'?'step="any" inputmode="decimal"':''} value="${esc(val??'')}" placeholder="${esc(f.ph||'')}">`;
 return `<div class="field ${f.wide?'span2':''}"><label for="${id}">${esc(f.l)}${f.u?` <span class="muted">(${f.u})</span>`:''}</label>${inp}</div>`}

 for(let m=toMin(h[1]);m+60<=toMin(h[2]);m+=60){if(m<now)continue;if(!busy.some(([s,e])=>m<e&&m+60>s))out.push(m)}return out}

/* ================= PLANO ALIMENTAR ================= */
const foodById=id=>FOODS.find(f=>f.id===id);

function pPlano(){const D=getDB(),u=U('plano');if(!u.cid)u.cid=D.clients.find(c=>c.status==='Ativo').id;const tk=WEEK[(TODAY.getDay()+6)%7];u.day=u.day||tk;const pl=planFor(u.cid);const meals=pl.days[u.day];const c=cli(u.cid);
 const tot=meals.reduce((s,m)=>{const t=mealTot(m);return{k:s.k+t.k,c:s.c+t.c,p:s.p+t.p,g:s.g+t.g}},{k:0,c:0,p:0,g:0});const pct=Math.min(100,Math.round(tot.k/pl.meta*100));
 const base=`@${S.prof}.plans.${u.cid}`;const mk=tot.c*4+tot.p*4+tot.g*9||1;
 return pageHead('Planos alimentares',`${esc(c.name)} · ${esc(c.extra.obj||'')} · atualizado em ${fmtD(pl.updated)}`,B('Copiar para todos os dias','planCopy',{ic:'copy'})+B('Enviar ao paciente','planSend',{c:'pri',ic:'send'}))+
 `<div class="toolbar"><div style="min-width:240px">${sel('pl-cli',D.clients.filter(x=>x.status!=='Inativo').map(x=>[x.id,x.name]),u.cid,{ch:'planCli'})}</div><div class="row nw"><label class="lbl" for="pl-meta">Meta diária</label><input class="input sm" style="width:96px" type="number" id="pl-meta" data-bind="${base}.meta" data-num="1" data-live="1" value="${pl.meta}"><span class="muted sm">kcal</span></div></div>
 ${tabs(WEEK.map(d=>[d,WEEKL[d]+(d===tk?' · hoje':'')]),u.day,'planDay')}
 <div class="layout"><section class="panel"><div class="panel-h"><h3>${WEEKL[u.day]} — ${meals.length} refeições</h3>${B('Adicionar refeição','mealAdd',{c:'sm',ic:'plus'})}</div>
 ${meals.length?meals.map((m,mi)=>{const t=mealTot(m);return `<div class="meal"><div class="meal-t"><input id="ml-${m.id}" data-bind="${base}.days.${u.day}.${mi}.time" value="${m.time}" aria-label="Horário da refeição"><span class="muted xs num">${Math.round(t.k)} kcal</span></div><div class="meal-b"><div class="row nw" style="justify-content:space-between;margin-bottom:6px"><input class="input sm" style="border-color:transparent;background:transparent;font-weight:600;font-size:14.5px;padding:0;height:28px;max-width:260px" id="mn-${m.id}" data-bind="${base}.days.${u.day}.${mi}.name" value="${esc(m.name)}" aria-label="Nome da refeição"><span class="row nw">${B('Alimento','foodAdd',{c:'sm ghost',ic:'plus',d:`data-v="${mi}"`})}${IB('trash','mealDel','Remover refeição',`data-v="${mi}"`)}</span></div>
  ${m.items.length?m.items.map((it,ii)=>{const f=foodById(it.fid);return `<div class="food"><span style="min-width:0"><b style="font-weight:500">${esc(f.n)}</b><br><small>${it.q!==1?nfmt(it.q,1)+' × ':''}${esc(f.por)}</small></span><small class="num hide-m">C ${nfmt(f.c*it.q,0)} · P ${nfmt(f.p*it.q,0)} · G ${nfmt(f.g*it.q,0)}</small><span class="num sm" style="font-weight:600">${Math.round(f.kcal*it.q)} kcal</span>${IB('x','foodDel','Remover alimento',`data-m="${mi}" data-v="${ii}"`)}</div>`}).join(''):'<p class="muted sm">Nenhum alimento. Use “+ Alimento”.</p>'}</div></div>`}).join(''):empty('apple','Dia sem refeições','Adicione refeições ou copie de outro dia.')}</section>
 <div class="stack">${panel('Resumo do dia',`<div class="row nw" style="gap:18px;margin-bottom:16px"><div class="ring" style="--p:${pct}"><div><b style="font-family:var(--f-display);font-size:20px" class="num">${Math.round(tot.k)}</b><br><span class="xs muted">de ${pl.meta} kcal</span></div></div><div class="col" style="gap:4px"><b style="font-weight:600">${pct}% da meta</b><span class="muted sm">${tot.k>pl.meta?`${Math.round(tot.k-pl.meta)} kcal acima`:`${Math.round(pl.meta-tot.k)} kcal disponíveis`}</span></div></div>
  <div class="col" style="gap:12px">${[['Carboidratos',tot.c,4,'var(--warn)'],['Proteínas',tot.p,4,'var(--brand)'],['Gorduras',tot.g,9,'var(--info)']].map(([l,g,k,cl])=>`<div class="macro" style="--c:${cl}"><div class="row nw" style="justify-content:space-between"><span class="sm">${l}</span><span class="sm num"><b>${Math.round(g)} g</b> <span class="muted">· ${Math.round(g*k/mk*100)}%</span></span></div><div class="bar"><i style="width:${Math.round(g*k/mk*100)}%"></i></div></div>`).join('')}</div>`)}
 ${panel('Distribuição por refeição',`<div class="col" style="gap:9px">${meals.map(m=>{const k=mealTot(m).k;return `<div class="row nw" style="gap:10px"><span class="num xs muted" style="width:40px">${m.time}</span><div class="bar" style="flex:1"><i style="width:${k/Math.max(1,tot.k)*100}%"></i></div><span class="num xs" style="width:52px;text-align:right">${Math.round(k)}</span></div>`}).join('')}</div>`)}

 cep:v=>{v=v.replace(/\D/g,'').slice(0,8);return v.replace(/(\d{5})(\d)/,'$1-$2')},

function genCPF(){const n=Array.from({length:9},()=>ri(0,9));const d=k=>{let s=0;for(let i=0;i<k;i++)s+=n[i]*(k+1-i);const r=s*10%11;return r===10?0:r};n.push(d(9));n.push(d(10));return MASKS.cpf(n.join(''))}

 }

function fValidate(fields,v){const e={};fields.forEach(f=>{if(!f.k)return;const x=fv(v,f.k);const blank=x==null||x===''||(Array.isArray(x)&&!x.length);

 if(f.t==='email'&&!/^\S+@\S+\.\S+$/.test(x))e[f.k]='Informe um e-mail válido';
 if(f.mask==='tel'&&String(x).replace(/\D/g,'').length<10)e[f.k]='Telefone incompleto';
 if(f.k.endsWith('cep')&&String(x).replace(/\D/g,'').length!==8)e[f.k]='CEP deve ter 8 dígitos';
 if(f.t==='date'&&f.max&&x>f.max)e[f.k]='Data no futuro';

function fichaTabs(){const p=S.prof,P=PROFS[p];const sp={odo:[['saude','Anamnese'],['odg','Odontograma'],['oplan','Plano e orçamento'],['evcl','Evolução clínica']],psi:[['pron','Prontuário'],['obj','Objetivos terapêuticos'],['pac','Pacotes e pagamentos']],nut:[['nutri','Ficha nutricional'],['aval','Avaliações físicas'],['planos','Planos alimentares']],fis:[['queixa','Queixa e objetivos'],['avft','Avaliações'],['ftrat','Plano de tratamento']],per:[['perfil','Perfil de treino'],['ptreinos','Treinos'],['aval','Avaliações físicas'],['phist','Histórico de treinos']],med:[['clin','Histórico clínico'],['vitals','Sinais vitais'],['mexa','Exames'],['mdocs','Prescrições e atestados']]}[p]||[['esp','Especialidade'],...(P.trat?[['ftrat',P.trat.label]]:[])];
 return[['geral','Visão geral'],...sp,['atend',P.sesss],['fin','Financeiro'],['docs','Documentos'],['dados','Cadastro'],['hist','Histórico']]}
function pFicha(){const D=getDB(),P=PROFS[S.prof],u=U('ficha');const c=cli(u.cid);
 if(!c)return pageHead('Ficha','')+`<section class="panel">${empty('user','Ficha não encontrada','O cadastro pode ter sido excluído.',B('Voltar para '+P.clients.toLowerCase(),'go',{c:'sm',d:'data-v="cli"'}))}</section>`;
 const tl=fichaTabs();if(!tl.some(t=>t[0]===u.tab))u.tab='geral';
 const ap=D.appts.filter(a=>a.cid===c.id);const done=ap.filter(a=>a.status==='concluido').length,miss=ap.filter(a=>a.status==='faltou').length;const nx=nextAppt(c.id),ls=lastAppt(c.id);
 const fin=D.fin.filter(f=>f.cid===c.id&&f.kind==='in');const paid=sum(fin.filter(f=>f.status==='recebido')),open=sum(fin.filter(f=>f.status==='pendente'));
 const al=[];if(c.alerg)al.push(['bad','alert',`<b>Alergia informada:</b> ${esc(c.alerg)}`]);
 if(S.prof==='per'&&c.sp?.fin==='Atrasado')al.push(['bad','wallet','<b>Mensalidade atrasada.</b> Combine o pagamento antes do próximo treino.']);
 if(open>0)al.push(['warn','wallet',`<b>${money(open)} em aberto</b> em ${fin.filter(f=>f.status==='pendente').length} lançamento(s).`,B('Ver financeiro','fTab',{c:'sm',d:'data-v="fin"'})]);
 if(S.prof==='per'&&c.sp?.libera==='Pendente')al.push(['warn','file','<b>Liberação médica pendente.</b>']);
 if(!c.lgpd)al.push(['info','shield','Termo de consentimento LGPD ainda não assinado.',B('Marcar como assinado','lgpdOk',{c:'sm',d:`data-id="${c.id}"`})]);
 if(c.status==='Aguardando retorno')al.push(['info','refresh',`${P.client} aguardando retorno. Último atendimento em ${ls?fmtD(ls.date):'—'}.`,B('Agendar retorno','newAppt',{c:'sm',d:`data-cid="${c.id}"`})]);
 const tabFn=FT[u.tab]||FT.geral;
 return `<div class="crumb"><button type="button" class="link" data-a="go" data-v="cli">${P.clients}</button>${icon('chevR',14)}<span>${esc(c.name)}</span></div>
 <section class="panel fhead"><div class="fhead-main">${av(c.name,c.photo,'xl')}<div class="grow"><div class="row" style="gap:10px"><h1>${esc(c.name)}</h1>${genPill(c.status)}${(c.tags||[]).map(t=>`<span class="tag">${icon('tag',12)}${esc(t)}</span>`).join('')}</div>
  <div class="fmeta"><span>${c.age} anos · ${esc(c.gender||'—')}</span><span>CPF ${esc(c.cpf||'—')}</span><span>${P.client} desde ${fmtD(c.since)}</span><span>${icon('user',13)}${esc(c.resp||D.team[0])}</span></div>
  <div class="fmeta"><span>${icon('phone',13)}${esc(c.phone)}</span><span>${icon('msg',13)}${esc(c.email||'—')}</span><span>${icon('wallet',13)}${esc(c.conv||'Particular')}</span></div></div>
  <div class="row">${B('WhatsApp','waMsg',{ic:'msg',d:`data-id="${c.id}"`})}${B('Editar','editClient',{ic:'edit',d:`data-id="${c.id}"`})}${B('Agendar','newAppt',{c:'pri',ic:'calendar',d:`data-cid="${c.id}"`})}<div class="rel">${B('','dd',{c:'icon',ic:'more',title:'Mais ações',d:'data-v="ficha"'})}${S.dd==='ficha'?`<div class="dd" style="right:0;top:44px"><button type="button" class="it" data-a="exportPron">${icon('download',16)}Exportar ficha (PDF)</button><button type="button" class="it" data-a="fichaStatus" data-id="${c.id}" data-v="${c.status==='Inativo'?'Ativo':'Inativo'}">${icon(c.status==='Inativo'?'refresh':'pause',16)}${c.status==='Inativo'?'Reativar cadastro':'Inativar cadastro'}</button><button type="button" class="it" data-a="waitAdd" data-cid="${c.id}">${icon('clock',16)}Adicionar à lista de espera</button><hr><button type="button" class="it" data-a="delClient" data-id="${c.id}" style="color:var(--bad)">${icon('trash',16)}Excluir cadastro</button></div>`:''}</div></div></div>
  <div class="fstats"><div><small>Próximo ${P.sess.toLowerCase()}</small><b>${nx?`${relDay(nx.date)} ${nx.time}`:'—'}</b></div><div><small>Último ${P.sess.toLowerCase()}</small><b>${ls?fmtS(ls.date):'—'}</b></div><div><small>Realizados</small><b>${done}</b></div><div><small>Faltas</small><b style="${miss?'color:var(--bad)':''}">${miss}</b></div><div><small>Total pago</small><b>${money(paid)}</b></div><div><small>Em aberto</small><b style="${open?'color:var(--warn)':''}">${money(open)}</b></div></div></section>
 ${al.length?`<div class="alerts">${al.map(([t,ic,x,act])=>`<div class="alert ${t}">${icon(ic,17)}<span>${x}</span>${act?`<span class="spacer"></span>${act}`:''}</div>`).join('')}</div>`:''}
 ${tabs(tl,u.tab,'fTab')}<div>${tabFn(c)}</div>`}
Object.assign(A,{
 fTab(d){U('ficha').tab=d.v;S.dd=null;render()},
 lgpdOk(d){const c=cli(d.id);c.lgpd=true;logC(c,'Termo de consentimento LGPD assinado','shield');toast('Termo registrado como assinado');render()},
 fichaStatus(d){const c=cli(d.id);c.status=d.v;S.dd=null;logC(c,`Status alterado para ${d.v}`,'refresh');toast(d.v==='Inativo'?'Cadastro inativado':'Cadastro reativado');render()},
 delClient(d){const c=cli(d.id);S.dd=null;confirmBox(`Excluir ${esc(c.name)}?`,`O cadastro e os agendamentos futuros serão removidos. Essa ação não pode ser desfeita.`,()=>{const D=getDB();D.clients=D.clients.filter(x=>x.id!==d.id);D.appts=D.appts.filter(a=>!(a.cid===d.id&&a.date>=TODAY_ISO));S.drawer=null;toast(`${first(c.name)} excluído(a)`);if(S.page==='ficha'){S.page='cli'}})}
});
const kvBlock=rows=>`<div class="dgrid">${rows.map(([l,v,w])=>`<div class="${w?'w':''}"><small>${esc(l)}</small><b class="${v===''||v==null||v==='—'?'em':''}">${v===''||v==null?'—':v}</b></div>`).join('')}</div>`;
function fmtField(f,c){const x=fv(c,f.k);if(f.t==='toggle')return x?'Sim':'Não';if(f.t==='date')return x?fmtD(x):'—';if(f.t==='money')return x?money(+x):'—';if(f.t==='chips')return x&&x.length?esc(x.join(', ')):'—';if(f.t==='range')return x!=null&&x!==''?`${x}/10`:'—';if(f.u&&x)return esc(x)+' '+f.u;if(f.t==='docs')return (x||[]).length+' documento(s)';return x===''||x==null?'—':esc(x)}
function secFromTab(c,tabId,title){const t=clientTabs().find(x=>x.id===tabId);if(!t)return'';const i=clientTabs().indexOf(t);return panel(title||t.l,kvBlock(t.fields.filter(f=>f.k&&f.t!=='docs').map(f=>[f.l,fmtField(f,c),f.w]))+(t.fields.some(f=>f.t==='calc')?'':''),{act:B('Editar','editClient',{c:'sm',ic:'edit',d:`data-id="${c.id}" data-tab="${i}"`})})}
FT.geral=c=>{const D=getDB(),P=PROFS[S.prof];const fut=D.appts.filter(a=>a.cid===c.id&&['agendado','confirmado'].includes(a.status)&&a.date>=TODAY_ISO).sort(byDT);const past=D.appts.filter(a=>a.cid===c.id&&a.date<=TODAY_ISO&&['concluido','faltou','cancelado'].includes(a.status)).sort(byDT).reverse();
 const notes=notesFor(c.id).slice(0,2);
 return `<div class="layout"><div class="stack">${(GERAL[S.prof]||(()=> ''))(c)}
 ${panel(`Próximos ${P.sesss.toLowerCase()}`,fut.length?`<div class="lst">${fut.slice(0,4).map(a=>apptRow(a,{date:1})).join('')}</div>`:empty('calendar','Nenhum horário marcado','',B('Agendar','newAppt',{c:'sm pri',ic:'plus',d:`data-cid="${c.id}"`})),{tight:1,act:B('Agendar','newAppt',{c:'sm',ic:'plus',d:`data-cid="${c.id}"`})})}
 ${panel('Últimos atendimentos',past.length?`<div class="lst">${past.slice(0,5).map(a=>`<div class="li click" data-a="openAppt" data-id="${a.id}"><div class="grow"><b>${esc(a.type)}</b><small>${fmtW(a.date)} · ${a.time} · ${esc(a.pro)}</small></div>${stPill(a.status)}</div>`).join('')}</div>`:empty('clock','Sem atendimentos ainda',''),{tight:1,act:`<button type="button" class="link" data-a="fTab" data-v="atend">Ver todos</button>`})}
 ${S.prof!=='psi'&&notes.length?panel('Últimas anotações',`<div class="tl">${notes.map(n=>`<div class="tl-it"><span class="tl-dot"></span><div class="tl-c"><div class="row nw" style="justify-content:space-between"><b style="font-weight:600;font-size:13px">${esc(n.type)}</b><span class="muted xs">${fmtD(n.date)}</span></div><p>${esc(n.text)}</p></div></div>`).join('')}</div>`):''}</div>
 <div class="stack">${panel('Contato',kvBlock([['Celular',esc(c.phone)],['Preferência',esc(c.contato||'—')],['E-mail',esc(c.email||'—'),1],['Endereço',c.addr?`${esc(c.addr.rua)}, ${esc(c.addr.num)}${c.addr.comp?' — '+esc(c.addr.comp):''}<br><span class="muted">${esc(c.addr.bairro)} · ${esc(c.addr.cidade)}/${esc(c.addr.uf)} · ${esc(c.addr.cep)}</span>`:'—',1]]),{act:B('Editar','editClient',{c:'sm',d:`data-id="${c.id}" data-tab="1"`})})}
 ${panel('Contato de emergência',c.emerg&&c.emerg.nome?`<div class="row nw">${av(c.emerg.nome,null,'sm')}<div style="flex:1"><b style="font-weight:600">${esc(c.emerg.nome)}</b><div class="muted sm">${esc(c.emerg.rel||'')} · ${esc(c.emerg.tel||'')}</div></div>${IB('phone','callEmerg','Ligar',`data-id="${c.id}"`)}</div>`:`<p class="muted sm">Não informado.</p>`)}
 ${panel('Saúde',kvBlock([['Alergias',c.alerg?`<span style="color:var(--bad)">${esc(c.alerg)}</span>`:'Nenhuma informada',1],['Medicamentos',esc(c.meds||'Nenhum informado'),1]]))}
 ${panel('Administrativo',kvBlock([[S.prof==='med'||S.prof==='odo'?'Convênio':'Cobrança',esc(c.conv||'—')],['Pagamento',esc(c.pay||'—')],['Origem',esc(c.origem||'—')],['Responsável',esc(c.resp||'—')],['Preferência',esc([c.pref?.turno,ddList(c.pref?.dias,'')].filter(Boolean).join(' · ')||'—'),1],['Observações',esc(c.obs||'—'),1]]))}</div></div>`};
const GERAL={};
A.callEmerg=d=>{const c=cli(d.id);sim(`Ligando para ${c.emerg.nome} · ${c.emerg.tel}`)};
FT.atend=c=>{const D=getDB(),P=PROFS[S.prof],u=U('ficha');u.ast=u.ast||'Todos';const all=D.appts.filter(a=>a.cid===c.id).sort(byDT).reverse();
 const list=all.filter(a=>u.ast==='Todos'||a.status===u.ast);const past=all.filter(a=>['concluido','faltou'].includes(a.status));
 return kpis([{l:'Realizados',ic:'check',v:all.filter(a=>a.status==='concluido').length},{l:'Faltas',ic:'x',v:all.filter(a=>a.status==='faltou').length},{l:'Cancelados',ic:'refresh',v:all.filter(a=>a.status==='cancelado').length},{l:'Comparecimento',ic:'target',v:pct(past.filter(a=>a.status==='concluido').length,past.length)+'%'},{l:'Agendados',ic:'calendar',v:all.filter(a=>['agendado','confirmado'].includes(a.status)).length}])+
 `<div class="toolbar">${chips([['Todos','Todos',all.length],...Object.entries(STATUS).filter(([k])=>k!=='bloqueio').map(([k,[l]])=>[k,l,all.filter(a=>a.status===k).length])],u.ast,'fAst')}<span class="spacer"></span>${B('Agendar','newAppt',{c:'pri sm',ic:'plus',d:`data-cid="${c.id}"`})}</div>
 <section class="panel">${list.length?`<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Data</th><th>Horário</th><th>${P.typeLabel}</th><th>Profissional</th><th>Modalidade</th><th>Status</th><th class="r">Valor</th><th></th></tr></thead><tbody>${list.map(a=>`<tr class="click" data-a="openAppt" data-id="${a.id}"><td data-l="Data">${fmtW(a.date)}</td><td data-l="Horário" class="num">${a.time}</td><td class="full"><b style="font-weight:600">${esc(a.type)}</b>${a.series?` <span class="muted" data-tip="Agendamento recorrente">${icon('repeat',13)}</span>`:''}</td><td data-l="Profissional">${esc(a.pro)}</td><td data-l="Modalidade">${esc(a.mode)}</td><td data-l="Status">${stPill(a.status)}</td><td data-l="Valor" class="r num">${money(a.price)}</td><td class="act">${IB('eye','openAppt','Ver detalhes',`data-id="${a.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('clock','Nada neste filtro','')}</section>`};
A.fAst=d=>{U('ficha').ast=d.v;render()};
FT.fin=c=>{const D=getDB();const all=D.fin.filter(f=>f.cid===c.id).sort((a,b)=>b.date.localeCompare(a.date));const ins=all.filter(f=>f.kind==='in');const paid=sum(ins.filter(f=>f.status==='recebido')),open=sum(ins.filter(f=>f.status==='pendente'));
 return kpis([{l:'Total pago',ic:'check',v:money(paid),s:`${ins.filter(f=>f.status==='recebido').length} pagamentos`},{l:'Em aberto',ic:'clock',v:money(open),s:open?'aguardando pagamento':'tudo em dia'},{l:'Ticket médio',ic:'chart',v:money(ins.length?sum(ins)/ins.length:0)},{l:'Forma preferida',ic:'wallet',v:esc(c.pay||'—'),sm:1}])+
 panel('Lançamentos',all.length?`<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Data</th><th>Descrição</th><th>Forma</th><th>Status</th><th class="r">Valor</th><th></th></tr></thead><tbody>${all.map(f=>`<tr class="click" data-a="finOpen" data-id="${f.id}"><td data-l="Data">${fmtD(f.date)}</td><td class="full"><b style="font-weight:600">${esc(f.desc)}</b></td><td data-l="Forma">${esc(f.method)}</td><td data-l="Status">${genPill(finSt(f))}</td><td data-l="Valor" class="r num" style="font-weight:600">${money(f.value)}</td><td class="act">${f.status==='pendente'?B('Receber','finPaid',{c:'sm',ic:'check',d:`data-id="${f.id}"`}):B('Recibo','finReceipt',{c:'sm ghost',ic:'file',d:`data-id="${f.id}"`})}</td></tr>`).join('')}</tbody></table></div>`:empty('wallet','Sem lançamentos',''),{tight:1,act:B('Novo lançamento','finNew',{c:'sm pri',ic:'plus',d:`data-cid="${c.id}"`})})};
FT.docs=c=>{const D=getDB();const docs=c.docs||[];const recDocs=[];['documentos','exames','prescricoes','atestados'].forEach(k=>(D.rec[k]||[]).filter(r=>r.cli===c.id).forEach(r=>recDocs.push({k,r})));
 return `<div class="toolbar"><span class="muted sm">${docs.length+recDocs.length} documento(s) · os arquivos ficam apenas neste navegador (simulação)</span><span class="spacer"></span><label class="btn pri sm">${icon('upload',15)}<span>Enviar documento</span><input type="file" hidden data-docfor="${c.id}"></label></div>

 ${recDocs.map(({k,r})=>`<div class="docc"><span class="di pdf">PDF</span><div class="grow"><b>${esc(r.titulo||r.tipo||r.exame||(k==='prescricoes'?'Prescrição':'Documento'))}</b><small>${esc(REC[k].title)} · ${fmtD(r.data)}</small><small>${genPill(r.status)}</small></div>${k==='exames'?'':IB('eye','docPrev','Visualizar',`data-k="${k}" data-id="${r.id}"`)}</div>`).join('')}
 <label class="upl">${icon('upload',18)}<span>Arraste ou clique para anexar</span><input type="file" hidden data-docfor="${c.id}"></label></div>`};

function timelineFor(c){const D=getDB(),P=PROFS[S.prof];const ev=[];(c.log||[]).forEach(l=>ev.push({d:l.d||'',t:l.t,x:l.x,ic:l.ic||'edit',by:l.by}));
 D.appts.filter(a=>a.cid===c.id&&a.date<=TODAY_ISO&&['concluido','faltou','cancelado'].includes(a.status)).forEach(a=>ev.push({d:a.date,t:`${fmtD(a.date)} às ${a.time}`,x:`${a.type}: ${STATUS[a.status][0].toLowerCase()}`,ic:a.status==='concluido'?'check':a.status==='faltou'?'x':'refresh',by:a.pro}));
 D.fin.filter(f=>f.cid===c.id&&f.status==='recebido').forEach(f=>ev.push({d:f.paidAt||f.date,t:fmtD(f.paidAt||f.date),x:`Pagamento recebido: ${money(f.value)} via ${f.method}`,ic:'wallet',by:'Financeiro'}));

function vitalsFor(cid){const D=getDB();D.vitals=D.vitals||{};if(!D.vitals[cid]){_seed=hashStr(cid+'vit');const c=cli(cid);const hyp=(c.sp?.antp||[]).includes('Hipertensão');const alt=ri(156,188);let pas=hyp?ri(146,158):ri(112,128),peso=ri(58,96);
 D.vitals[cid]=Array.from({length:6},(_,i)=>{const r={id:uid(),date:iso(addDays(TODAY,-(5-i)*28-ri(0,6))),pas,pad:Math.round(pas*.64),fc:ri(64,86),temp:+(36+rnd()*.8).toFixed(1),spo2:ri(95,99),peso:+peso.toFixed(1),alt,glic:ri(84,112)};pas+=hyp?-ri(2,6):ri(-3,3);peso+=rnd()*1.2-.8;return r})}return D.vitals[cid]}
const paSt=v=>v.pas>=140||v.pad>=90?['Elevada','bad']:v.pas>=130||v.pad>=85?['Limítrofe','warn']:['Normal','ok'];
function vitalsView(cid){const vs=vitalsFor(cid).slice().sort((a,b)=>a.date.localeCompare(b.date));const l=vs[vs.length-1],f=vs[0];const u=U('vit');u.k=u.k||'pa';
 if(!l)return empty('activity','Sem registros','',B('Registrar sinais vitais','vitNew',{c:'pri sm',ic:'plus',d:`data-cid="${cid}"`}));const ps=paSt(l);const im=imc(l.peso,l.alt);
 const series={pa:[{l:'Sistólica',c:'var(--accent)',pts:vs.map(v=>({date:v.date,v:v.pas}))},{l:'Diastólica',c:'var(--info)',pts:vs.map(v=>({date:v.date,v:v.pad}))}],fc:[{l:'FC',c:'var(--accent)',pts:vs.map(v=>({date:v.date,v:v.fc}))}],peso:[{l:'Peso',c:'var(--accent)',pts:vs.map(v=>({date:v.date,v:v.peso}))}],glic:[{l:'Glicemia',c:'var(--accent)',pts:vs.map(v=>({date:v.date,v:v.glic}))}]}[u.k];
 return kpis([{l:'Pressão arterial',ic:'heart',v:`${l.pas}/${l.pad}`,s:`<span class="pill ${ps[1]}">${ps[0]}</span> mmHg`},{l:'Frequência cardíaca',ic:'activity',v:l.fc,s:'bpm'},{l:'Saturação',ic:'drop',v:l.spo2+'%',s:'SpO₂'},{l:'Temperatura',ic:'activity',v:nfmt(l.temp,1)+' °C'},{l:'Peso · IMC',ic:'scale',v:nfmt(l.peso,1)+' kg',s:im?`IMC ${nfmt(im,1)} · ${imcClass(im)[0]}`:''},{l:'Glicemia',ic:'drop',v:l.glic,s:'mg/dL'}])+
 `<div class="layout"><section class="panel"><div class="panel-h"><h3>Evolução</h3>${seg([['pa','Pressão'],['fc','FC'],['peso','Peso'],['glic','Glicemia']],u.k,'vitK')}</div><div class="panel-b">${u.k==='pa'?`<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--accent)"></i>Sistólica</span><span><i style="background:var(--info)"></i>Diastólica</span></div>`:''}${lineMulti(series,{ref:u.k==='pa'?[{v:140,l:'140 mmHg'},{v:90,l:'90 mmHg',c:'var(--warn)'}]:u.k==='glic'?[{v:100,l:'100 mg/dL',c:'var(--warn)'}]:[],d:u.k==='peso'?1:0})}<p class="muted xs" style="margin-top:6px">Primeiro registro em ${fmtD(f.date)}. Valores fictícios.</p></div></section>
 ${panel('Registros',`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>PA</th><th>FC</th><th>SpO₂</th><th>Peso</th><th></th></tr></thead><tbody>${vs.slice().reverse().map(v=>`<tr><td>${fmtS(v.date)}</td><td class="num"><span style="color:${paSt(v)[1]==='bad'?'var(--bad)':'inherit'};font-weight:${paSt(v)[1]==='bad'?600:400}">${v.pas}/${v.pad}</span></td><td class="num">${v.fc}</td><td class="num">${v.spo2}%</td><td class="num">${nfmt(v.peso,1)}</td><td class="act">${IB('trash','vitDel','Excluir',`data-id="${v.id}" data-cid="${cid}"`)}</td></tr>`).join('')}</tbody></table></div>`,{tight:1,act:B('Registrar','vitNew',{c:'sm pri',ic:'plus',d:`data-cid="${cid}"`})})}</div>`}
function pVitals(){const D=getDB(),u=U('vit');if(!u.cid)u.cid=D.clients.find(c=>c.status==='Ativo').id;
 const att=D.clients.filter(c=>{const v=vitalsFor(c.id);const l=v[v.length-1];return l&&paSt(l)[1]==='bad'});
 return pageHead('Sinais vitais','Pressão, frequência cardíaca, saturação, temperatura, peso e glicemia por paciente.',B('Registrar sinais vitais','vitNew',{c:'pri',ic:'plus'}))+
 `<div class="toolbar"><div style="min-width:260px">${sel('vit-cli',clientOpts(),u.cid,{ch:'vitCli'})}</div>${B('Abrir ficha','openClient',{c:'sm',d:`data-id="${u.cid}"`})}<span class="spacer"></span>${att.length?`<span class="pill bad plain">${att.length} pacientes com PA elevada na última medição</span>`:''}</div>`+vitalsView(u.cid)}

const PH_COLORS=['#3E7CB1','#1C7A56','#D9581F','#8A968F','#6B4FA6','#B5543A'];
const DAYKEYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function periodFor(cid){const D=getDB();D.period=D.period||{};if(!D.period[cid]){_seed=hashStr(cid+'per');const c=cli(cid);const obj=c.sp?.obj||'';
 const P=/Hipertrofia|Performance/.test(obj)?[['Adaptação anatômica',2,'Técnica e resistência muscular','55–65% 1RM','15–20'],['Hipertrofia I',4,'Volume progressivo','65–75% 1RM','10–12'],['Força',3,'Cargas altas, mais descanso','80–85% 1RM','4–6'],['Deload',1,'Recuperação ativa','50% 1RM','12'],['Hipertrofia II',2,'Intensificação','70–80% 1RM','8–10']]:/Emagrec/.test(obj)?[['Adaptação',2,'Técnica e condicionamento','55–60% 1RM','15'],['Resistência muscular',4,'Circuitos e baixa pausa','60–65% 1RM','15–20'],['Metabólico',4,'Força + intervalados','65–75% 1RM','10–15'],['Deload',1,'Recuperação','50% 1RM','12'],['Manutenção',1,'Consolidação','65% 1RM','12']]:[['Base',3,'Mobilidade e técnica','55–65% 1RM','12–15'],['Desenvolvimento',4,'Força geral','65–75% 1RM','10–12'],['Específico',3,'Objetivo do aluno','70–80% 1RM','8–10'],['Deload',1,'Recuperação','50% 1RM','12'],['Reteste',1,'Avaliação e testes','—','—']];
 const freq=parseInt(c.sp?.freq||c.extra?.freq)||3;D.period[cid]={start:iso(weekStart(addDays(TODAY,-7*ri(3,6)))),split:['AB','AB','AB','ABC','ABCD','ABCDE','ABCDE'][freq]||'ABC',phases:P.map(([n,w,foco,int,reps],i)=>({id:uid(),n,w,foco,int,reps,c:PH_COLORS[i%PH_COLORS.length]}))}}return D.period[cid]}
const trainDays=c=>{const d=(c.sp?.dias||[]).filter(x=>DAYKEYS.includes(x));if(d.length)return d;const f=parseInt(c.sp?.freq||c.extra?.freq)||3;return [['Seg','Qui'],['Seg','Qua','Sex'],['Seg','Ter','Qui','Sex'],['Seg','Ter','Qua','Qui','Sex']][Math.min(3,Math.max(0,f-2))]};
function tlogFor(cid){const D=getDB();D.tlog=D.tlog||{};if(!D.tlog[cid]){_seed=hashStr(cid+'tlog');const c=cli(cid);const days=trainDays(c);const ts=D.treinos.filter(t=>t.cid===cid);const out=[];let k=0;let vol=ri(5200,7600);
 for(let i=-42;i<0;i++){const d=addDays(TODAY,i);const dk=DAYKEYS[(d.getDay()+6)%7];if(!days.includes(dk))continue;if(rnd()<.13){k++;continue}const t=ts.length?ts[k%ts.length]:null;k++;vol+=ri(-150,260);out.push({id:uid(),date:iso(d),treino:t?t.name:'Treino livre',dur:ri(48,75),vol:Math.round(vol/10)*10,rpe:ri(6,9),st:rnd()<.9?'Concluído':'Parcial'})}
 D.tlog[cid]=out.reverse()}return D.tlog[cid]}

function inBreak(dIso,m,dur){const D=getDB();const dk=WEEK[(parse(dIso).getDay()+6)%7];return(D.breaks||[]).some(b=>b.days.includes(dk)&&m<toMin(b.b)&&m+dur>toMin(b.a))||(D.blocks||[]).some(b=>b.date===dIso&&m<toMin(b.b)&&m+dur>toMin(b.a))}

 for(let m=toMin(h[1]);m+60<=toMin(h[2]);m+=60){if(m<now||inBreak(dIso,m,60))continue;if(!busy.some(([s,e])=>m<e&&m+60>s))out.push(m)}return out}

  return kpis([{l:'Redução média da dor',ic:'activity',v:nfmt(sum(rows,r=>r.eva)/rows.length,1)+' pts',s:'escala EVA'},{l:'Ganho médio de ADM',ic:'ruler',v:'+'+Math.round(sum(rows,r=>r.adm)/rows.length)+' p.p.',s:'% da amplitude esperada'},{l:'Altas',ic:'check',v:D.trats.filter(t=>t.status==='Concluído').length},{l:'Sessões realizadas',ic:'clock',v:sum(D.trats,t=>t.real||0),s:'em planos de tratamento'}])+panel('Resultados por paciente',`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Paciente</th><th>Região</th><th class="r">Dor (EVA)</th><th class="r">ADM</th></tr></thead><tbody>${rows.slice(0,12).map(r=>`<tr class="click" data-a="openClient" data-id="${r.c.id}"><td><div class="who">${av(r.c.name,null,'sm')}<b>${esc(r.c.name)}</b></div></td><td>${esc(regOf(r.c))}</td><td class="r num"><span class="trend up">${r.eva}</span></td><td class="r num"><span class="trend up">+${r.adm} p.p.</span></td></tr>`).join('')}</tbody></table></div>`,{tight:1})}
 if(p==='med'){const ex=D.rec.exames||[];const ty={};ex.forEach(e=>ty[e.exame]=(ty[e.exame]||0)+1);const te=Object.entries(ty).sort((a,b)=>b[1]-a[1]);const tm=te[0]?.[1]||1;const hi=D.clients.filter(c=>{const v=vitalsFor(c.id).slice(-1)[0];return v&&paSt(v)[1]==='bad'});
  return kpis([{l:'Exames solicitados',ic:'file',v:ex.length},{l:'Aguardando resultado',ic:'clock',v:ex.filter(e=>e.status==='Aguardando resultado').length},{l:'Retornos pendentes',ic:'refresh',v:(D.rec.retornos||[]).filter(r=>r.status==='Pendente').length},{l:'PA elevada',ic:'heart',v:hi.length,s:'na última medição'},{l:'Documentos emitidos',ic:'file',v:(D.rec.atestados||[]).length+(D.rec.prescricoes||[]).length}])+`<div class="layout">${panel('Exames por tipo',`<div class="col" style="gap:11px">${te.map(([t,v])=>`<div><div class="row nw" style="justify-content:space-between;margin-bottom:4px"><span class="sm">${esc(t)}</span><span class="sm num muted">${v}</span></div><div class="bar"><i style="width:${v/tm*100}%"></i></div></div>`).join('')}</div>`)}${panel('Pacientes com pressão elevada',`<div class="lst" style="margin:-16px">${hi.map(c=>{const v=vitalsFor(c.id).slice(-1)[0];return `<div class="li click" data-a="openClient" data-id="${c.id}">${av(c.name,null,'sm')}<div class="grow"><b>${esc(c.name)}</b><small>${fmtD(v.date)}</small></div><span class="pill bad plain">${v.pas}/${v.pad}</span></div>`}).join('')||empty('check','Nenhum paciente','')}</div>`)}</div>`}
 const ts=D.trats;if(ts.length)return kpis([{l:'Planos ativos',ic:'activity',v:ts.filter(t=>t.status==='Em andamento').length},{l:'Sessões realizadas',ic:'check',v:sum(ts,t=>t.real||0)},{l:'Concluídos',ic:'target',v:ts.filter(t=>t.status==='Concluído').length}])+`<div class="trat-grid">${ts.slice(0,6).map(tratCard).join('')}</div>`;
 return `<section class="panel">${empty('chart','Relatórios específicos','Os indicadores gerais estão nas outras abas.')}</section>`}
